[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdmc"
version = "0.2.0"
description = "Systemic Dimensional Model of Cyberprofiling for SOCMINT analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Source-Available Non-Commercial License" }
authors = [
  { name = "Sr. Maximus" }
]
keywords = ["socmint", "osint", "cyberprofiling", "disc", "systems-theory"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = []

[project.scripts]
sdmc = "sdmc.cli:main"

[tool.setuptools.packages.find]
include = ["sdmc*"]
